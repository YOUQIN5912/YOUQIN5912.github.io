- id: diffraction
  title: Diffraction and total scattering
  items:
    - name: TOPAS
      description: Rietveld refinement of powder diffraction data and real-space fitting of atomic pair distribution functions.
      links:
        - label: TOPAS Academic
          url: https://topas-academic.com/
        - label: Bruker TOPAS
          url: https://www.bruker.com/en/products-and-solutions/diffractometers-and-x-ray-microscopes/x-ray-diffractometers/diffrac-suite-software/diffrac-topas.html
    - name: GSAS-II
      description: Processing and structural refinement of X-ray and neutron diffraction data.
      links:
        - label: Documentation
          url: https://gsasii.github.io/
    - name: FullProf Suite
      description: Profile fitting and Rietveld refinement of X-ray and neutron powder diffraction patterns.
      links:
        - label: Project site
          url: https://www.ill.eu/en/for-ill-users/software-and-scientific-tools/software-scientific-tools/fullprof-suite/
    - name: PDFgui
      description: Refining structural models against X-ray and neutron pair distribution functions.
      links:
        - label: Documentation
          url: https://www.diffpy.org/diffpy.pdfgui/
    - name: PDFgetX3 and PDFgetN3
      description: Converting X-ray and neutron powder total scattering data, respectively, to pair distribution functions.
      links:
        - label: DiffPy documentation
          url: https://www.diffpy.org/products/pdfgetx.html
    - name: RMCProfile
      description: Large-box reverse Monte Carlo modelling constrained by scattering data.
      links:
        - label: Project site
          url: https://rmcprofile.ornl.gov/
    - name: DISCUS
      description: Building models of disordered or defective crystals and simulating diffuse scattering and pair distribution functions.
      links:
        - label: DISCUS Suite
          url: https://tproffen.github.io/DiffuseCode/
    - name: Total Scattering School
      description: Recorded lectures and software tutorials from the 2021 virtual school, covering X-ray and neutron total scattering, data reduction and PDF analysis.
      links:
        - label: Workshop recordings
          url: https://scatteringpage.utk.edu/ts-schoolvideos/

- id: xas
  title: X-ray absorption spectroscopy
  items:
    - name: Athena and Artemis
      description: I use Athena to align and normalise XAS scans, and Artemis to fit EXAFS using FEFF scattering paths.
      links:
        - label: Athena docs
          url: https://bruceravel.github.io/demeter/documents/Athena/index.html
        - label: Artemis docs
          url: https://bruceravel.github.io/demeter/documents/Artemis/index.html
    - name: Larix
      description: Interactive XANES and EXAFS processing, visualisation and analysis with XrayLarch.
      links:
        - label: Documentation
          url: https://xraypy.github.io/xraylarch/larix.html

- id: modelling
  title: Atomistic modelling
  items:
    - name: VASP
      description: Density functional theory calculations for structural relaxation and defect energetics, and ab initio molecular dynamics.
      links:
        - label: Documentation
          url: https://vasp.at/wiki/
    - name: Ab initio molecular dynamics (AIMD)
      description: DFT forces are calculated at each time step to follow atomic motion and study diffusion, thermal disorder and structural fluctuations at finite temperature.
      links:
        - label: Molecular dynamics in VASP
          url: https://vasp.at/wiki/Molecular-dynamics_calculations
    - name: CASTEP
      description: Plane-wave DFT calculations for crystal structure and materials properties.
      links:
        - label: Project site
          url: https://www.castep.org/
    - name: Quantum ESPRESSO
      description: Plane-wave pseudopotential DFT calculations for periodic materials.
      links:
        - label: Project site
          url: https://www.quantum-espresso.org/
    - name: pymatgen
      description: Representing and transforming crystal structures, preparing calculation inputs and analysing materials data in Python.
      links:
        - label: Documentation
          url: https://pymatgen.org/
    - name: Materials Studio
      description: BIOVIA software for building, simulating and analysing atomistic and molecular models across multiple scales.
      links:
        - label: Dassault Systèmes product page
          url: https://www.3ds.com/products/biovia/materials-studio
    - name: Atomsk
      description: Command-line tools for building supercells, interfaces and defects and converting atomistic file formats.
      links:
        - label: Project site
          url: https://atomsk.univ-lille.fr/

- id: thermodynamics
  title: Thermodynamic modelling
  items:
    - name: HSC Chemistry
      description: Thermochemical calculations for reaction energetics, equilibrium compositions and stability diagrams, with tools for process simulation.
      links:
        - label: Metso product page
          url: https://www.metso.com/portfolio/hsc-chemistry/
    - name: FactSage
      description: Thermochemical databases and calculation tools for multicomponent phase equilibria and phase diagrams.
      links:
        - label: FactSage website
          url: https://factsage.com/

- id: microscopy
  title: Electron microscopy and elemental maps
  items:
    - name: Fiji / ImageJ
      description: Inspecting STEM images and exported elemental maps with line profiles and overlays.
      links:
        - label: Fiji documentation
          url: https://imagej.net/software/fiji/

- id: visualisation
  title: Data analysis and visualisation
  items:
    - name: Python and Matplotlib
      description: Reproducible data processing, comparison of experiments and simulations, and preparation of publication figures.
      links:
        - label: Python
          url: https://www.python.org/
        - label: Matplotlib
          url: https://matplotlib.org/stable/
    - name: VESTA
      description: Visualising crystal structures, defects and atomistic supercells.
      links:
        - label: Project site
          url: https://jp-minerals.org/vesta/en/
    - name: OVITO
      description: Visualising and analysing atomistic simulation trajectories, including local structure, defects and atomic displacements.
      links:
        - label: Project site
          url: https://www.ovito.org/

- id: materials-informatics
  title: AI/ML and materials screening
  items:
    - name: matminer
      description: Turning compositions and crystal structures into numerical descriptors and accessing curated materials datasets.
      links:
        - label: Documentation
          url: https://hackingmaterials.lbl.gov/matminer/
    - name: scikit-learn
      description: Building and evaluating regression and classification models for materials property prediction and screening.
      links:
        - label: Documentation
          url: https://scikit-learn.org/stable/
